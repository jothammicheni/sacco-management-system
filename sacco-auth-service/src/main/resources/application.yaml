server:
  port: 8088

app:
  activation:
    base-url: http://localhost:3000
  bootstrap:
    admin:
      phone: "254113730593"        # your admin phone
      password: "12345678"      # dev password
      pin: "1234"
      email: "admin@gmail.com"
spring:
  application:
    name: sacco-auth-service

  # =============================================
  # SPRING SECURITY AUTO-CONFIG — DISABLED
  # Gateway validates JWTs and injects X-User-Id.
  # Auth-service has no SecurityFilterChain, so the
  # default auto-config must be excluded (otherwise
  # every endpoint requires basic auth).
  # =============================================
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

  # =============================================
  # KAFKA - CONSUMER + PRODUCER
  # =============================================
  kafka:
    bootstrap-servers: localhost:9092

    # ------------------ CONSUMER ------------------
    # Account Service consumes member.* events from Member Service.
    # Producer publishes pre-serialized JSON strings (because of the outbox
    # pattern), so the consumer must also read strings and parse manually.
    consumer:
      group-id: sacco-auth-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    # ------------------ PRODUCER ------------------
    # Outbox publisher sends pre-serialized JSON strings.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

    # ------------------ LISTENER ------------------
    listener:
      ack-mode: manual

  # =============================================
  # MYSQL DATABASE
  # =============================================
  datasource:
    url: jdbc:mysql://localhost:3306/sacco_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: user

  # =============================================
  # JPA / HIBERNATE
  # =============================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        type:
          preferred_uuid_jdbc_type: CHAR

jwt:
  secret: dev-only-jwt-secret-do-not-use-in-production-1234567890
  access-token-ttl-seconds: 900
  setup-token-ttl-seconds: 600

# =============================================
# LOGGING (was accidentally nested under jwt:)
# =============================================
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG
    org.springframework.security.web.access: DEBUG