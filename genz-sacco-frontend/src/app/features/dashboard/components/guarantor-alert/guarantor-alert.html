@if (requests().length > 0) {
  <div class="space-y-3">
    @for (req of requests(); track req.requestId) {
      <div class="flex flex-col sm:flex-row sm:items-center gap-3 p-4 rounded-xl bg-amber-50 border border-amber-200">

        <div class="flex items-start gap-3 flex-1">
          <span class="text-2xl shrink-0">⚠️</span>
          <div>
            <p class="text-xs font-bold uppercase tracking-wide text-amber-800">
              Guarantor Request
            </p>
            <p class="text-sm text-slate-800 mt-1">
              <strong>{{ req.requesterName }}</strong> wants you to guarantee
              <strong>{{ formatKES(req.amount) }}</strong> for a {{ req.loanType }}.
            </p>
          </div>
        </div>

        <a
          routerLink="/guarantors/{{ req.requestId }}"
          class="shrink-0 inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white text-sm font-semibold transition">
          Review &amp; Respond
          <span>→</span>
        </a>
      </div>
    }
  </div>
}
