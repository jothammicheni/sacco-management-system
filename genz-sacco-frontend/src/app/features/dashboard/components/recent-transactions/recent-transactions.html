<div class="bg-white rounded-xl border border-slate-200 overflow-hidden">

  <div class="flex items-center justify-between p-5 border-b border-slate-200">
    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">
      Recent Transactions
    </h2>
    <a routerLink="/statements"
       class="text-sm font-medium text-brand-700 hover:text-brand-900">
      View All →
    </a>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
        <tr>
          <th class="text-left px-5 py-3 font-semibold">Date</th>
          <th class="text-left px-5 py-3 font-semibold">Description</th>
          <th class="text-left px-5 py-3 font-semibold">Reference</th>
          <th class="text-left px-5 py-3 font-semibold">Status</th>
          <th class="text-right px-5 py-3 font-semibold">Amount</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (tx of transactions(); track tx.reference) {
          <tr class="hover:bg-slate-50 transition">
            <td class="px-5 py-3 text-slate-700 whitespace-nowrap">
              {{ formatDate(tx.date) }}
            </td>
            <td class="px-5 py-3 text-slate-800">{{ tx.description }}</td>
            <td class="px-5 py-3 font-mono text-xs text-slate-500">
              {{ tx.reference }}
            </td>
            <td class="px-5 py-3">
              <span class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold"
                    [class]="statusClass(tx.status)">
                {{ tx.status }}
              </span>
            </td>
            <td class="px-5 py-3 text-right font-semibold whitespace-nowrap"
                [class]="tx.amount >= 0 ? 'text-green-700' : 'text-slate-800'">
              {{ formatKES(tx.amount) }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
