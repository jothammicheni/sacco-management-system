server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      httpclient:
        connect-timeout: 3000
        response-timeout: 10s

      default-filters:
        - AddResponseHeader=X-Gateway, api-gateway

      routes:
        - id: auth-service
          uri: http://localhost:8088            # ← changed
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCB
                fallbackUri: forward:/fallback/auth

        - id: account-service
          uri: http://localhost:8087            # ← changed
          predicates:
            - Path=/api/v1/account/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountServiceCB
                fallbackUri: forward:/fallback/account

        - id: member-service
          uri: http://localhost:8086            # ← changed
          predicates:
            - Path=/api/v1/members/**
          filters:
            - name: CircuitBreaker
              args:
                name: memberServiceCB
                fallbackUri: forward:/fallback/member

        - id: notification-service
          uri: http://localhost:8089            # ← changed
          predicates:
            - Path=/api/v1/notification/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationServiceCB
                fallbackUri: forward:/fallback/notification

jwt:
  secret: dev-only-jwt-secret-do-not-use-in-production-1234567890

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: when_authorized