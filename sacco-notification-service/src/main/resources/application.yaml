server:
  port: 8089

spring:
  application:
    name: notification-service

  # =============================================
  # EMAIL (Gmail SMTP) — DEV ONLY, credentials inline
  # ⚠ Rotate the app password before pushing to any repo
  # =============================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: jothammurimi2001@gmail.com
    password: hwxg drdz tlwb ypkh
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # =============================================
  # KAFKA - CONSUMER
  # =============================================
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sacco-notification-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

  # =============================================
  # MYSQL
  # =============================================
  datasource:
    url: jdbc:mysql://localhost:3306/sacco_notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: user

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR

# =============================================
# LOGGING
# =============================================
logging:
  level:
    com.example: INFO
    org.springframework.mail: DEBUG     # shows SMTP conversation — useful for debugging